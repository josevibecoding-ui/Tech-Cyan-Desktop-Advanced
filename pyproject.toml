[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-documental"
version = "0.1.0"
description = "Fase 1"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "pytesseract>=0.3.13",
    "pymupdf>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
documental = "documental.cli:main"

[tool.setuptools.packages.find]
where = ["src"]